name: easytier-libbox

# 产出 libbox.aar / libbox-legacy.aar（Android）。工具链版本与本地实测一致：
# Go 1.27.2 + JDK17 + NDK 28.0.13004108 + build-tools 37.0.0 + gomobile v0.1.13。
# 注意：aar 落在仓库根，SFA 读的是 app/libs —— 下游 apk 工作流负责拷贝，别再漏这一步。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "gomobile platform"
        type: choice
        default: android/arm64
        options:
          - android/arm64
          - android/arm
          - android/386
          - android/amd64
          - android

permissions:
  contents: read

jobs:
  aar:
    runs-on: ubuntu-latest
    env:
      PLATFORM: ${{ inputs.platform }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.2"
          cache: true

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: "platform-tools build-tools;37.0.0 platforms;android-36 ndk;28.0.13004108"

      - name: 安装 gomobile / gobind（sing-box 用的是 sagernet fork，不是官方 x/mobile）
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.12
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.12
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/28.0.* | head -1)"
          echo "NDK=$ANDROID_NDK_HOME"
          ls -l "$(go env GOPATH)/bin"/gomobile "$(go env GOPATH)/bin"/gobind
          gomobile version

      - name: 构建 libbox.aar
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export ANDROID_NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/28.0.* | head -1)"
          go run ./cmd/internal/build_libbox -target android -platform "$PLATFORM"
          ls -la libbox.aar libbox-legacy.aar

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: libbox-aar
          path: |
            libbox.aar
            libbox-legacy.aar
          if-no-files-found: error

# 触发 GitHub 对该文件的登记（新仓 workflow 索引滞后）
